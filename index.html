<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DyReXR Media</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DyReXR">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: #1a1a2e;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid #2a2a4a;
        }
        h2 { color: #e94560; margin-bottom: 5px; font-size: 24px;}
        p { color: #888; font-size: 13px; margin-bottom: 20px; }
        input[type="url"], select {
            width: 90%;
            padding: 15px;
            margin-bottom: 15px;
            background: #16213e;
            border: 1px solid #e94560;
            color: #fff;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }
        input[type="url"] { direction: ltr; }
        input::placeholder { color: #555; }
        select { width: 98%; cursor: pointer; }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        button:hover { background-color: #d13050; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #status {
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>DyReXR Downloader</h2>
        <p>تحميل مباشر وصامت بدون تحويلك لأي موقع</p>
        
        <input type="url" id="mediaLink" placeholder="الصق الرابط هنا..." required>
        
        <select id="formatSelect">
            <option value="video">فيديو (أعلى جودة HD)</option>
            <option value="audio">صوت فقط (MP3)</option>
        </select>

        <button id="actionBtn" onclick="fetchMedia()">تنزيل الملف</button>
        
        <div id="status"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW setup failed'));
        }

        async function fetchMedia() {
            let link = document.getElementById('mediaLink').value.trim();
            const format = document.getElementById('formatSelect').value;
            const isAudio = format === 'audio';
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('actionBtn');
            
            if (link.startsWith('/')) link = link.substring(1);

            if(!link.startsWith('http')) {
                statusDiv.innerHTML = "<span style='color:#ff5252;'>الرابط غير صحيح!</span>";
                return;
            }

            // تنظيف روابط اليوتيوب
            if (link.includes('youtube.com') || link.includes('youtu.be')) {
                const ytMatch = link.match(/(?:v=|\/)([0-9A-Za-z_-]{11}).*/);
                if (ytMatch && ytMatch[1]) link = `https://www.youtube.com/watch?v=${ytMatch[1]}`;
            }

            btn.innerText = "جاري سحب الملف...";
            btn.disabled = true;
            statusDiv.innerHTML = "<span style='color:#ffb86c;'>جاري المعالجة... ⏳</span>";

            try {
                // تيك توك: إجبار السيرفر على جودة HD وسحبها كملف مباشر
                if (link.includes('tiktok.com') && !isAudio) {
                    const response = await fetch(`https://www.tikwm.com/api/?url=${link}&hd=1`);
                    const data = await response.json();
                    
                    if (data.code === 0 && data.data) {
                        const hdVideo = data.data.hdplay || data.data.play; // أولوية قصوى للـ HD
                        statusDiv.innerHTML = "<span style='color:#4caf50;'>تم العثور على الجودة الأصلية! جاري التنزيل... 🎬</span>";
                        await forceDownload(hdVideo, `DyReXR_TikTok_${Date.now()}.mp4`);
                        statusDiv.innerHTML = "<span style='color:#4caf50;'>تم الحفظ بنجاح! شيك على (الملفات). 🎉</span>";
                        return resetBtn(btn);
                    }
                }

                // باقي المنصات (يوتيوب، إكس، انستا) عبر Cobalt بدون تحويل للموقع
                const response = await fetch('https://api.cobalt.tools/api/json', {
                    method: 'POST',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        url: link,
                        vQuality: "max", // إجبار الجودة العالية
                        isAudioOnly: isAudio,
                        aFormat: "mp3"
                    })
                });

                const data = await response.json();

                if (data.url) {
                    statusDiv.innerHTML = "<span style='color:#4caf50;'>تم تجهيز الملف! جاري التنزيل الصامت... ⏳</span>";
                    await forceDownload(data.url, `DyReXR_Media_${Date.now()}.${isAudio ? 'mp3' : 'mp4'}`);
                    statusDiv.innerHTML = "<span style='color:#4caf50;'>تم الحفظ بنجاح! شيك على (الملفات). 🎉</span>";
                } else if (data.status === 'picker') {
                    let html = "<span style='color:#4caf50;'>هذا الرابط يحتوي على صور، اضغط عليها للحفظ:</span><br>";
                    data.picker.forEach((item, index) => {
                        html += `<a href="${item.url}" target="_blank" style="display:inline-block; margin:5px; padding:8px 12px; background:#4caf50; color:white; border-radius:5px; text-decoration:none;">صورة ${index + 1}</a>`;
                    });
                    statusDiv.innerHTML = html;
                } else {
                    statusDiv.innerHTML = `<span style='color:#ff5252;'>فشل السحب. المقطع قد يكون محمي أو عليه قيود.</span>`;
                }

            } catch (error) {
                statusDiv.innerHTML = "<span style='color:#ff5252;'>حدث خطأ في الاتصال بالشبكة.</span>";
                console.error(error);
            } finally {
                resetBtn(btn);
            }
        }

        // هذه الدالة هي سر الحل: تقوم بتنزيل الملف في الخلفية كـ Blob ولا تسمح للموقع بفتح صفحات جديدة
        async function forceDownload(url, filename) {
            try {
                const response = await fetch(url);
                if(!response.ok) throw new Error('Network error');
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click(); // ضغطة وهمية للتحميل
                
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
            } catch (e) {
                // إذا رفض المتصفح التنزيل المخفي بسبب الحماية، نفتح نافذة تحميل مباشرة بدون تغيير صفحة التطبيق
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = filename;
                a.target = '_blank'; // مهم جداً عشان ما يخرجك من التطبيق
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }
        }

        function resetBtn(btn) {
            btn.innerText = "تنزيل الملف";
            btn.disabled = false;
        }
    </script>
</body>
</html>
