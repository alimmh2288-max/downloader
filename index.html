<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DyReXR Media</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DyReXR">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: #1a1a2e;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid #2a2a4a;
        }
        h2 { color: #e94560; margin-bottom: 5px; font-size: 24px;}
        p { color: #888; font-size: 13px; margin-bottom: 20px; }
        input[type="url"], select {
            width: 90%;
            padding: 15px;
            margin-bottom: 15px;
            background: #16213e;
            border: 1px solid #e94560;
            color: #fff;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
        }
        input[type="url"] { direction: ltr; }
        input::placeholder { color: #555; }
        select { width: 98%; cursor: pointer; }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        button:hover { background-color: #d13050; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #status {
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>DyReXR Downloader</h2>
        <p>الكل في واحد: يوتيوب، تيك توك، انستا، إكس</p>
        
        <input type="url" id="mediaLink" placeholder="الصق الرابط هنا..." required>
        
        <select id="formatSelect">
            <option value="video">تحميل كـ (فيديو بأعلى جودة)</option>
            <option value="audio">تحميل كـ (صوت MP3 فقط)</option>
        </select>

        <button id="actionBtn" onclick="fetchMedia()">تحميل الآن</button>
        
        <div id="status"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW setup failed'));
        }

        async function fetchMedia() {
            let link = document.getElementById('mediaLink').value.trim();
            const format = document.getElementById('formatSelect').value;
            const isAudio = format === 'audio';
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('actionBtn');
            
            if (link.startsWith('/')) link = link.substring(1);

            if(!link.startsWith('http')) {
                statusDiv.innerHTML = "<span style='color:#ff5252;'>تأكد من الرابط!</span>";
                return;
            }

            // فلترة رابط اليوتيوب إذا كان صوتي عشان نشيل قوائم التشغيل
            if (link.includes('youtube.com') || link.includes('youtu.be')) {
                const ytMatch = link.match(/(?:v=|\/)([0-9A-Za-z_-]{11}).*/);
                if (ytMatch && ytMatch[1]) link = `https://www.youtube.com/watch?v=${ytMatch[1]}`;
            }

            btn.innerText = "جاري المعالجة...";
            btn.disabled = true;
            statusDiv.innerHTML = "<span style='color:#ffb86c;'>جاري الاتصال بالسيرفرات... ⏳</span>";

            try {
                // نظام خاص لتيك توك يجبره يسحب الـ HD (4K)
                if (link.includes('tiktok.com') && !isAudio) {
                    const response = await fetch(`https://www.tikwm.com/api/?url=${link}&hd=1`);
                    const data = await response.json();
                    
                    if (data.code === 0 && data.data) {
                        const hdVideo = data.data.hdplay || data.data.play;
                        statusDiv.innerHTML = "<span style='color:#4caf50;'>تم سحب الـ HD! جاري التنزيل... 🎬</span>";
                        window.location.href = hdVideo;
                        return finishUI(btn, statusDiv, hdVideo);
                    }
                }

                // نظام متعدد السيرفرات لباقي المنصات لتخطي الحظر (CORS)
                const cobaltMirrors = [
                    'https://co.wuk.sh/api/json',
                    'https://cobalt.owo.vc/api/json',
                    'https://api.cobalt.tools/api/json'
                ];

                let successData = null;

                for (let api of cobaltMirrors) {
                    try {
                        const response = await fetch(api, {
                            method: 'POST',
                            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                            body: JSON.stringify({ url: link, vQuality: "max", isAudioOnly: isAudio })
                        });
                        
                        if (response.ok) {
                            const data = await response.json();
                            if (data.url || data.picker) {
                                successData = data;
                                break; // إذا نجح الاتصال يوقف الدوران
                            }
                        }
                    } catch (e) {
                        console.warn('السيرفر عليه ضغط، نجرب اللي بعده...');
                    }
                }

                if (successData) {
                    if (successData.url) {
                        statusDiv.innerHTML = "<span style='color:#4caf50;'>تم التجهيز! جاري الفتح للحفظ... 🎉</span>";
                        window.location.href = successData.url;
                        finishUI(btn, statusDiv, successData.url);
                    } else if (successData.status === 'picker') {
                        let html = "<span style='color:#4caf50;'>تم سحب الصور (اضغط مطولاً للحفظ):</span><br>";
                        successData.picker.forEach((item, index) => {
                            html += `<a href="${item.url}" target="_blank" style="display:block; color:#e94560; margin-top:10px; text-decoration:none;">تحميل صورة ${index + 1}</a>`;
                        });
                        statusDiv.innerHTML = html;
                        btn.innerText = "تحميل الآن";
                        btn.disabled = false;
                    }
                } else {
                    statusDiv.innerHTML = `<span style='color:#ff5252;'>فشل التحميل. السيرفرات عليها ضغط حالياً أو المقطع خاص.</span>`;
                }

            } catch (error) {
                statusDiv.innerHTML = "<span style='color:#ff5252;'>حدث خطأ في الاتصال.</span>";
            } finally {
                if(!btn.disabled === false) { // إذا ما تفعل بالدوال اللي فوق
                    btn.innerText = "تحميل الآن";
                    btn.disabled = false;
                }
            }
        }

        function finishUI(btn, statusDiv, fallbackUrl) {
            setTimeout(() => {
                btn.innerText = "تحميل الآن";
                btn.disabled = false;
                statusDiv.innerHTML = `<span style='color:#888;'>إذا لم يبدأ التحميل، <a href='${fallbackUrl}' target='_blank' style='color:#e94560;'>اضغط هنا</a></span>`;
            }, 3000);
        }
    </script>
</body>
</html>
