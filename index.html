<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DyReXR Media</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DyReXR">

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f0f1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }
        .container {
            background: #1a1a2e;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            text-align: center;
            width: 90%;
            max-width: 400px;
            border: 1px solid #2a2a4a;
        }
        h2 { color: #e94560; margin-bottom: 5px; font-size: 24px;}
        p { color: #888; font-size: 13px; margin-bottom: 25px; }
        input[type="url"] {
            width: 90%;
            padding: 15px;
            margin-bottom: 15px;
            background: #16213e;
            border: 1px solid #e94560;
            color: #fff;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            direction: ltr;
        }
        input::placeholder { color: #555; }
        button {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 16px 30px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        button:hover { background-color: #d13050; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        #status {
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>DyReXR Downloader</h2>
        <p>الكل في واحد: يوتيوب، تيك توك، انستا، إكس</p>
        
        <input type="url" id="mediaLink" placeholder="الصق الرابط هنا..." required>
        <button id="actionBtn" onclick="fetchMedia()">تحميل الآن</button>
        
        <div id="status"></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                console.log('Service Worker Registered');
            });
        }

        async function fetchMedia() {
            let link = document.getElementById('mediaLink').value.trim();
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('actionBtn');
            
            if (link.startsWith('/')) link = link.substring(1);

            if(!link.startsWith('http')) {
                statusDiv.innerHTML = "<span style='color:#ff5252;'>تأكد من الرابط!</span>";
                return;
            }

            btn.innerText = "جاري المعالجة...";
            btn.disabled = true;
            statusDiv.innerHTML = "<span style='color:#ffb86c;'>جاري سحب المقطع... ⏳</span>";

            try {
                // إذا كان الرابط تيك توك (نستخدم السيرفر المضمون لتيك توك)
                if (link.includes('tiktok.com')) {
                    const response = await fetch(`https://www.tikwm.com/api/?url=${link}`);
                    const data = await response.json();

                    if (data.code === 0 && data.data) {
                        statusDiv.innerHTML = "<span style='color:#4caf50;'>تم التجهيز! جاري فتح الملف... 🎉</span>";
                        window.location.href = data.data.play;
                    } else {
                        statusDiv.innerHTML = `<span style='color:#ff5252;'>فشل التحميل، تأكد أن المقطع عام.</span>`;
                    }
                } 
                // للمنصات الأخرى (يوتيوب، انستقرام، إكس)
                else {
                    // تنظيف رابط اليوتيوب لتفادي مشاكل قوائم التشغيل
                    const ytMatch = link.match(/(?:v=|\/)([0-9A-Za-z_-]{11}).*/);
                    if (ytMatch && (link.includes('youtube') || link.includes('youtu.be'))) {
                        link = `https://www.youtube.com/watch?v=${ytMatch[1]}`;
                    }

                    const response = await fetch('https://api.cobalt.tools/api/json', {
                        method: 'POST',
                        headers: {
                            'Accept': 'application/json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            url: link,
                            vQuality: "max"
                        })
                    });

                    const data = await response.json();

                    if (data.url) {
                        statusDiv.innerHTML = "<span style='color:#4caf50;'>تم التجهيز! جاري التنزيل... 🎉</span>";
                        window.location.href = data.url;
                    } else if (data.status === 'picker') {
                        let html = "<span style='color:#4caf50;'>صور متعددة:</span><br>";
                        data.picker.forEach((item, index) => {
                            html += `<a href="${item.url}" target="_blank" style="display:block; color:#e94560; margin-top:10px; text-decoration:none;">تحميل صورة ${index + 1}</a>`;
                        });
                        statusDiv.innerHTML = html;
                    } else {
                        statusDiv.innerHTML = `<span style='color:#ff5252;'>فشل التحميل من هذا الرابط.</span>`;
                    }
                }
            } catch (error) {
                statusDiv.innerHTML = "<span style='color:#ff5252;'>خطأ أمني بالاتصال. تأكد أنك رافع الملف على استضافة (https) وليس من الكمبيوتر مباشرة.</span>";
                console.error(error);
            } finally {
                btn.innerText = "تحميل الآن";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
